syntax = "proto3";
package Protocol;

enum PlayerType
{
	PLAYER_TYPE_NONE = 0;
	PLAYER_TYPE_KNIGHT = 1;
	PLAYER_TYPE_MAGE = 2;
	PLAYER_TYPE_ARCHER = 3;
	PLAYER_TYPE_DUMMY = 4;
	PLAYER_TYPE_HUMAN = 5;
}

enum LoginResult {
	LOGIN_SUCCESS			= 0;
	LOGIN_EMAIL_NOT_FOUND	= 2; // Email 미등록
	LOGIN_PW_MISMATCH		= 3; // 비밀번호 불일치
	LOGIN_SERVER_ERROR		= 98; // 기타 내부 오류
	LOGIN_DEFAULT_ERROR		= 99; // 기본 에러
}

enum RegisterResult {
	REGISTER_SUCCESS		 = 0;
	REGISTER_DUPLICATE_EMAIL = 1; // 이메일 중복
	REGISTER_SERVER_ERROR    = 98; // 기타 내부 오류
	REGISTER_DEFAULT_ERROR	 = 99; // 기본 에러
}